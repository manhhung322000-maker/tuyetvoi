<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp mời cưới</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--rose:#800020;--deep:#5c0016;--ink:#3d000e;--pink:#f6c4d1;--ivory:#fffaf2;--rg:#d9b45a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Cormorant Garamond","Times New Roman",serif;line-height:1.5;overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 20%,#d42a3e 0%,#9a1428 55%,#520813 100%) fixed}
#fx,#fx0{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}#fx0{z-index:0}
.stage{z-index:1;min-height:100svh;display:grid;place-items:center;perspective:1400px;padding:24px 0 60px;position:relative}
.stage>*{grid-area:1/1}
.hint{align-self:end;justify-self:center;margin:0;font-style:italic;color:#ffe3b0;font-size:18px;text-align:center;padding:0 16px}
.hint.h2,.open .hint.h1{display:none}.open .hint.h2{display:block}

/* envelope */
.env{--ew:min(88vw,430px);width:var(--ew);height:calc(var(--ew)*.68);position:relative;will-change:transform;transition:transform 1s cubic-bezier(.6,0,.3,1),opacity .8s}
.env>*{position:absolute}
.env::before{content:"";position:absolute;inset:-22% -12%;background:radial-gradient(closest-side,rgba(255,206,140,.42),transparent);pointer-events:none}
.env::after{content:"";position:absolute;inset:0 -3px -3px;z-index:7;pointer-events:none;border:solid #d4a437;border-width:0 3px 3px;border-image:linear-gradient(135deg,#fff0b8,#d4a437 50%,#fff0b8) 1;box-shadow:0 0 28px rgba(255,214,120,.5)}
.flap svg{position:absolute;inset:0;width:100%;height:100%}
.env .vp,.env .vf{inset:0;width:100%;height:100%;pointer-events:none}.env .vp{z-index:4}.env .vf{z-index:5;transition:opacity .2s}.opening .vf{opacity:0}
.env .back{inset:0;background:#800020;z-index:1;box-shadow:0 1px 0 #580016,0 2px 0 #500014,0 3px 0 #480012,0 4px 0 #40000f,0 5px 0 #38000d,0 6px 0 #30000b,0 40px 50px rgba(30,0,8,.7)}
.env .letter{left:6%;right:6%;top:5%;height:90%;background:var(--ivory);z-index:3;transition:transform 1.1s cubic-bezier(.3,.9,.3,1) .55s;box-shadow:inset 0 0 0 4px var(--ivory),inset 0 0 0 5px var(--rg)}
.env .pocket{inset:0;z-index:4;background:#800020;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .pocket::after{content:"";position:absolute;inset:0;background:none}
.pocket i{position:absolute;inset:0}.pocket .fl{clip-path:polygon(0 0,50% 56%,0 100%);background:#800020}.pocket .fr{clip-path:polygon(100% 0,50% 56%,100% 100%);background:#800020}.pocket .fb{clip-path:polygon(0 100%,50% 56%,100% 100%);background:#800020}
.env .flap{left:0;right:0;top:0;height:66%;z-index:5;transform-origin:top;background:#800020;clip-path:polygon(0 0,100% 0,50% 100%)}
.env .orn{width:30%;left:2%;bottom:2%;z-index:5;opacity:.95}
.seal{position:absolute;left:50%;top:60%;width:26%;aspect-ratio:1.1;transform:translate(-50%,-50%);z-index:6;border:0;clip-path:url(#hc);padding:0 0 7%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#e8344a,#a50f22 60%,#6e0614);color:#ffe9b0;font:600 calc(var(--ew)*.12)/1 "Noto Serif SC","Songti SC",serif;
  animation:beat 1.3s ease-in-out infinite}
.seal:focus-visible{filter:brightness(1.15)}
.sealsh,.sealrim{position:absolute;left:50%;top:60%;width:29.5%;aspect-ratio:1.1;z-index:6;clip-path:url(#hc);pointer-events:none}
.sealsh{transform:translate(-50%,-36%);background:rgba(25,0,8,.5)}
.sealrim{transform:translate(-50%,-50%);background:linear-gradient(135deg,#fff3c4,#d4a437 55%,#8f6420)}
.opening .sealsh,.opening .sealrim{opacity:0;transition:opacity .3s}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}15%{transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.07)}}
.opening .seal{animation:crack .5s forwards}
@keyframes crack{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.opening .flap{animation:flap .9s .25s cubic-bezier(.5,0,.3,1) forwards}
@keyframes flap{0%{transform:rotateX(0);z-index:5}49%{z-index:5}50%{z-index:2}100%{transform:rotateX(180deg);z-index:2}}
.opening .letter{transform:translateY(-68%)}
.open .env{transform:translateY(55vh) scale(.7)!important;opacity:0;pointer-events:none}

/* card */
.card3d{--w:min(86vw,380px,calc((100svh - 130px)/1.5));width:var(--w);height:calc(var(--w)*1.5);font-size:calc(var(--w)/22.5);
  position:relative;transform-style:preserve-3d;opacity:0;visibility:hidden;transform:scale(.8);will-change:transform;cursor:pointer;outline:none}
.open .card3d{opacity:1;visibility:visible;transition:opacity .7s .35s}
.gnd{--w:min(86vw,380px,calc((100svh - 130px)/1.5));width:calc(var(--w)*.8);height:34px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,0,6,.8),transparent);align-self:center;justify-self:center;opacity:0;pointer-events:none;transform:translate(calc(var(--gx,0)*1px),calc(var(--w)*.8 + 34px)) scale(var(--gs,1))}.open .gnd{opacity:1;transition:opacity .8s .4s}
.card3d:focus-visible .front{box-shadow:0 0 0 3px var(--deep)}
.edge{display:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;overflow:clip;
  display:flex;flex-direction:column;align-items:center;text-align:center;outline:2px solid #e8c76a;outline-offset:3px;box-shadow:0 30px 60px rgba(25,0,6,.7),0 0 44px rgba(255,214,150,.3)}
.face *{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face::before{content:"";position:absolute;inset:.7em;border:1px solid var(--rg);outline:1px solid var(--rg);outline-offset:-.35em;pointer-events:none}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at calc(var(--mx,50)*1%) calc(var(--my,50)*1%),rgba(255,255,255,.18),transparent 48%)}
.orn{position:absolute;width:40%;pointer-events:none}
.face .orn{display:none}
.orn.tl{top:0;left:0}.orn.br{bottom:0;right:0;transform:rotate(180deg)}
.front .orn{transform:translateZ(75px)}.front .orn.br{transform:translateZ(75px) rotate(180deg)}
.front{transform:translateZ(1px);background:#800020;justify-content:center;gap:.5em}
.front .z1{transform:translateZ(70px)}.front .z2{transform:translateZ(50px)}.front .z3{transform:translateZ(36px)}
.foil{background:linear-gradient(105deg,#0000 38%,#fffbe6 50%,#0000 62%) 130% 0/260% 100% no-repeat,linear-gradient(100deg,#8f6420 0%,#e9c466 18%,#fff0b0 30%,#c9962e 46%,#f4dc8e 62%,#a8741f 80%,#ecd07a 100%) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sheen 4.5s ease-in-out infinite alternate}
@keyframes sheen{from{background-position:130% 0,0 0}to{background-position:-40% 0,100% 0}}
@media (prefers-reduced-motion:reduce){.foil{animation:none}}
.coin{position:relative;width:3.1em;height:2.8em;font:600 1.9em/1 "Noto Serif SC","Songti SC",serif;}
.coin::before{content:"";position:absolute;inset:0;clip-path:url(#hc);background:linear-gradient(135deg,#fff0b8,#d4a437)}
.coin span{position:absolute;inset:.13em;clip-path:url(#hc);display:grid;place-items:center;padding-bottom:.22em;background:radial-gradient(circle at 35% 25%,#ff6b6b,#d4202f 60%,#a30f22);color:#ffe9b0;font-size:.9em}
.names{font-family:"Great Vibes","Snell Roundhand",cursive;font-weight:400;font-size:calc(3.7em*var(--nz,1));line-height:1.1;margin:.2em 0 -.05em;padding:.25em .3em .38em}
.names span{display:block}.names i{display:block;font:italic 400 .42em/1.2 "Cormorant Garamond",serif;-webkit-text-fill-color:#f0d487}
.small{font-size:1.02em;letter-spacing:.2em;margin:0}
.small.foil{background:none;animation:none;-webkit-text-fill-color:#f8e08e;color:#f8e08e;font-weight:600;font-size:1.35em;letter-spacing:.24em;text-shadow:0 1px 3px rgba(30,0,8,.7)}
.finv{margin:.2em 0 0;max-width:17em;font-style:italic;font-size:1.12em;line-height:1.35;color:#ffe9b0}
.big{font-size:1.5em;letter-spacing:.14em;margin:0;font-weight:600}
.tap{position:absolute;bottom:1.5em;margin:0;font-size:.85em;font-style:italic;color:#f0d487;opacity:.9}
.face.back *{backface-visibility:visible;-webkit-backface-visibility:visible}
.back .sm,.back .date,.back .venue{transform:translateZ(28px)}.back .fam,.back .inv{transform:translateZ(16px)}
.back{transform:rotateY(180deg) translateZ(1px);background:linear-gradient(#fffaf2,#fff0de);justify-content:space-between;padding:2.1em 1.9em 1.9em}
.back .orn{width:30%;opacity:.9}
.back .sm{font-family:"Great Vibes",cursive;font-size:2.5em;line-height:1;color:var(--rose);margin:0}
.back p{margin:0}.inv{font-style:italic;font-size:1.02em;max-width:19em}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:1em;font-size:.9em;line-height:1.4;width:100%}
.fam b{display:block;color:var(--rose);font-size:.88em;letter-spacing:.14em;margin-bottom:.15em}
.rule{width:7em;height:1px;background:linear-gradient(90deg,transparent,var(--rg),transparent)}
.date strong{display:block;font-size:2.9em;font-weight:500;line-height:1.05;color:var(--rose)}
.date small{display:block;font-size:.8em;font-style:italic;color:#8a5a68}
.venue{font-size:.95em}.venue b{display:block;font-size:1.2em;color:var(--rose)}
.thanks{font-style:italic;font-size:.88em}

/* after */
.after{position:relative;z-index:1;display:none;max-width:520px;margin:0 auto;padding:0 16px 70px;text-align:center}
.open .after{display:block;animation:in .8s .6s both}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.panel{background:#fbeff1;border:1px solid var(--rg);padding:20px;margin-bottom:22px}
.mapart{width:100%;height:auto;display:block;border:1px solid var(--rg);margin-bottom:12px}.mv{margin:0 0 10px}.mv b{display:block;color:var(--rose);font-size:1.2em}
a.b{display:inline-block;text-decoration:none;font:inherit;font-size:17px;line-height:1.4;min-height:44px;padding:10px 20px;border:1px solid var(--rose);background:var(--rose);color:#fff;margin:4px}
.cd{display:flex;justify-content:center;gap:10px}
.cd div{min-width:64px;background:#fff;border:1px solid var(--rg);padding:8px 4px}.cd span{display:block;font-size:30px;line-height:1.1;color:var(--rose);font-weight:600}.cd i{font-style:normal;font-size:14px;color:#8a5a68}
.cal h3,.map h3,.alb h3{font:400 38px "Great Vibes",cursive;margin:0 0 6px;color:var(--rose)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:17px}
.grid b{font-weight:600;color:#8a5a68;font-size:14px}
.grid span{aspect-ratio:1;display:grid;place-items:center;position:relative}
.grid .on{background:var(--rose);color:#fff;border-radius:50%;font-weight:600}
.grid .on::after{content:"♥";position:absolute;top:-9px;right:-3px;color:#e0527c;font-size:15px}
button.b{font:inherit;font-size:17px;min-height:44px;padding:10px 20px;border:1px solid var(--rose);background:#fff;color:var(--rose);cursor:pointer;margin:4px}
button.b.p{background:var(--rose);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.rsvp h2{font:400 40px "Great Vibes",cursive;margin:0 0 4px;color:var(--rose)}
input,textarea{font:inherit;width:100%;padding:10px 12px;margin:4px 0 10px;border:1px solid var(--rg);background:#fff;color:var(--ink)}
#msg{margin:12px 0 0;font-style:italic;color:var(--rose)}

/* editor */
.edbtn{background:#ffe3b0!important;color:#8a0f20!important;border-color:#d9b45a!important;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:55;margin:0;box-shadow:0 4px 14px rgba(138,46,77,.25)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:76svh;overflow:auto;background:#fff9fa;border-top:2px solid var(--rose);padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .45s cubic-bezier(.3,.9,.3,1);box-shadow:0 -18px 40px rgba(138,46,77,.3)}
.sheet.show{transform:none}
.sheet .in{max-width:520px;margin:0 auto}
.sheet h2{font:400 36px "Great Vibes",cursive;color:var(--rose);margin:0 0 6px}
.sheet h4{margin:14px 0 4px;color:var(--deep);font-size:16px;letter-spacing:.1em}
.sheet label{display:block;font-size:15px;color:#8a5a68}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:none;width:100%;height:7.4em;border:1px solid var(--rg);padding:.25em;background:#fff;box-shadow:0 .2em .6em rgba(60,0,14,.25)}.ph img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}.hasph .ph{display:block}.hasph .sm{display:none}
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ag .ti{padding:0;margin:0;min-height:0;border:1px solid var(--rg);background:#fff;aspect-ratio:1;cursor:pointer;overflow:hidden}
.ag .ti img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}.ag .ti:hover img{transform:scale(1.08)}
.lb{position:fixed;inset:0;z-index:70;background:rgba(20,0,6,.93);display:grid;place-items:center;padding:16px}
.lb[hidden]{display:none}
.lb img{max-width:92vw;max-height:80svh;border:2px solid #e8c76a;box-shadow:0 20px 60px #000a;object-fit:contain}
.lb button{position:absolute;background:#0006;border:1px solid #e8c76a;color:#ffe3b0;font-size:30px;line-height:1;width:48px;height:48px;cursor:pointer;margin:0;padding:0}
#lx{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}#lpv{left:8px;top:50%;transform:translateY(-50%)}#lnx{right:8px;top:50%;transform:translateY(-50%)}
#lc{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);color:#ffe3b0;margin:0}
.wish h2{font:400 40px "Great Vibes",cursive;margin:0 0 4px;color:var(--rose)}
.wish textarea{min-height:96px;resize:vertical}
#wl{margin-top:18px;text-align:left}
.w{background:#fff;border:1px solid var(--rg);padding:12px 14px;margin-bottom:10px}
.w b{color:var(--rose);font-size:1.1em}.w small{float:right;color:#8a5a68;font-size:14px}.w p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.wnote{font-size:14px;color:#8a5a68;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.seal{animation:none}}
@media print{
  @page{size:A5 portrait;margin:0}
  html,body{background:#fff!important;overflow:visible}:root{padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #fx0,#fx,.env,.hint,.after,.glare,.tap,.edge,.gnd,.edbtn,.sheet{display:none!important}
  .stage{display:block;min-height:0;padding:0;perspective:none}
  .card3d{--w:148mm;width:148mm;height:auto;opacity:1!important;visibility:visible!important;transform:none!important;display:block}
  .face{position:relative;transform:none!important;width:148mm;height:210mm;box-shadow:none;outline:none;break-after:page;backface-visibility:visible}
  .face *:not(.orn){transform:none!important}.orn{transform:none!important}.orn.br{transform:rotate(180deg)!important}
}

/* album slide + album đầy đủ */
.ag{display:flex;grid-template-columns:none;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ag::-webkit-scrollbar{display:none}
.ag .ti{flex:0 0 100%;aspect-ratio:1;scroll-snap-align:center;border:0}
.dots{display:flex;justify-content:center;gap:7px;margin:10px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#e3c2c9;transition:.3s}.dots i.on{background:var(--rose);transform:scale(1.3)}
.am{position:fixed;inset:0;z-index:65;background:rgba(20,0,6,.95);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
.am[hidden]{display:none}
.am h3{font:400 40px "Great Vibes",cursive;color:#ffe3b0;text-align:center;margin:0 0 14px}
.ag2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:720px;margin:0 auto}
.ag2 .ti{padding:0;margin:0;border:1px solid var(--rg);background:#fff;aspect-ratio:1;cursor:pointer;overflow:hidden}
.ag2 .ti img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}.ag2 .ti:hover img{transform:scale(1.08)}
#ax{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;background:#0006;border:1px solid #e8c76a;color:#ffe3b0;font-size:30px;line-height:1;width:48px;height:48px;cursor:pointer;padding:0;z-index:2}
@media print{.am{display:none!important}}

/* album coverflow */
.panel.alb{background:none;border:0;padding:0;margin-bottom:26px}
.alb h3{display:inline-block;margin:0 0 18px;font:600 19px "Cormorant Garamond","Times New Roman",serif;letter-spacing:.22em;color:var(--rose);background:var(--ivory);border:1px solid var(--rg);outline:1px solid var(--rg);outline-offset:-5px;border-radius:12px;padding:12px 36px;box-shadow:0 6px 18px rgba(25,0,6,.4)}
.ag.cf{display:block;position:relative;overflow:hidden;perspective:900px;scroll-snap-type:none;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ag.cf .ti{position:absolute;left:50%;top:20px;flex:none;width:var(--cw);height:calc(var(--cw)*1.5);aspect-ratio:auto;border:2px solid rgba(255,255,255,.55);border-radius:14px;box-shadow:0 14px 30px rgba(25,0,6,.55);transition:transform .55s cubic-bezier(.3,.9,.3,1),opacity .55s}
.ag.cf .ti img{pointer-events:none;-webkit-user-drag:none}.ag.cf .ti:hover img{transform:none}
.cnt{margin:10px 0 10px;color:#f0d487;font-style:italic;font-size:17px;letter-spacing:.1em}
.alb button.b{background:transparent;color:#ffe3b0;border-color:#e8c76a}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="df"></defs></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><clipPath id="hc" clipPathUnits="objectBoundingBox"><path d="M0.5,0.96 C0.12,0.68 0,0.45 0,0.28 C0,0.11 0.13,0 0.28,0 C0.4,0 0.47,0.07 0.5,0.15 C0.53,0.07 0.6,0 0.72,0 C0.87,0 1,0.11 1,0.28 C1,0.45 0.88,0.68 0.5,0.96Z"/></clipPath></svg>
<canvas id="fx0"></canvas><canvas id="fx"></canvas>

<main class="stage" id="stage">
  <div class="env" id="env">
    <div class="back"></div><div class="letter"></div><div class="pocket"><i class="fl"></i><i class="fr"></i><i class="fb"></i></div><div class="flap"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,0 100,0 50,100" fill="none" stroke="#f0d487" stroke-width="5" vector-effect="non-scaling-stroke"/></svg></div>
    <svg class="vp" viewBox="0 0 100 68" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,0 50,38 100,0" fill="none" stroke="#f0d487" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>
    
    <svg class="orn" viewBox="0 0 140 140" data-g></svg>
    <div class="sealsh"></div><div class="sealrim"></div><button class="seal" id="seal" aria-label="Mở thiệp">囍</button>
  </div>
  <p class="hint h1" data-b="hintOpen"></p>
  <p class="hint h2" data-b="hintFlip"></p>

  <div class="gnd" id="gnd"></div>
  <article class="card3d" id="card" tabindex="0" role="button" aria-label="Thiệp mời cưới, chạm để lật mặt">
    <div class="edge"></div>
    <section class="face front">
      <svg class="orn tl" viewBox="0 0 140 140" data-g></svg><svg class="orn br" viewBox="0 0 140 140" data-g></svg>
      <div class="coin z1" aria-hidden="true"><span>囍</span></div>
      <p class="small z3 foil" data-b="cardTitle"></p>
      <h1 class="names foil z2"><span data-b="bride"></span><i>&amp;</i><span data-b="groom"></span></h1>
      <p class="finv z3" data-b="invite"></p>
      <p class="big z3 foil" data-b="dmy"></p>
      <p class="tap" data-b="tapHint"></p>
      <div class="glare"></div>
    </section>
    <section class="face back">
      <svg class="orn tl" viewBox="0 0 140 140" data-g></svg><svg class="orn br" viewBox="0 0 140 140" data-g></svg>
      <p class="sm"><span data-b="bride"></span> &amp; <span data-b="groom"></span></p>
      <div class="ph"><img id="phimg" alt="Ảnh cưới"></div>
      <p class="inv" data-b="invite"></p>
      <div class="fam">
        <div><b data-b="brideSide"></b><span data-b="gf"></span><br><span data-b="gm"></span><br><span data-b="gaddr"></span></div>
        <div><b data-b="groomSide"></b><span data-b="bf"></span><br><span data-b="bm"></span><br><span data-b="baddr"></span></div>
      </div>
      <div class="rule"></div>
      <p class="date"><span data-b="atTime"></span> <span data-b="tm"></span>, <span data-b="wd"></span><strong data-b="dmy"></strong><small data-b="lunar"></small></p>
      <p class="venue"><b data-b="venue"></b><span data-b="addr"></span></p>
      <p class="thanks" data-b="thanks"></p>
      <div class="glare"></div>
    </section>
  </article>
</main>

<section class="after">
  <div class="panel alb" id="alb" hidden><h3 data-b="albumTitle"></h3><div class="ag cf" id="ag"></div><p class="cnt" id="cnt"></p><button class="b" id="allbtn" data-b="albumAll"></button></div>
  <div class="panel"><div class="cd" id="cd" aria-label="Đếm ngược đến ngày cưới"></div></div>
  <div class="panel cal"><h3 id="mt"></h3><div class="grid" id="grid"></div></div>
  <div class="panel map"><h3 data-b="mapTitle"></h3>
    <svg class="mapart" viewBox="0 0 300 150" aria-hidden="true"><rect width="300" height="150" fill="#f4e4e7"/><path d="M0 118 C60 96 90 130 150 112 S250 90 300 104 L300 150 L0 150Z" fill="#d3e2ee"/><ellipse cx="58" cy="40" rx="42" ry="24" fill="#d2e4cf"/><ellipse cx="246" cy="34" rx="34" ry="20" fill="#d2e4cf"/><g fill="none" stroke="#fff" stroke-linecap="round"><path d="M0 82 L300 54" stroke-width="9"/><path d="M112 0 L150 150" stroke-width="9"/><path d="M214 0 L238 150" stroke-width="6"/><path d="M0 28 L110 44 M160 66 L300 130" stroke-width="4"/></g><ellipse cx="138" cy="96" rx="16" ry="4" fill="#0003"/><g transform="translate(114 40) scale(2)"><path d="M12 21C5 15 2 11 2 7.5 2 4.5 4.3 2.5 7 2.5 9 2.5 11 3.8 12 5.5 13 3.8 15 2.5 17 2.5 19.7 2.5 22 4.5 22 7.5 22 11 19 15 12 21Z" fill="#8a1228" stroke="#fff" stroke-width="1"/><circle cx="12" cy="8.5" r="2.4" fill="#fff"/></g></svg>
    <p class="mv"><b data-b="venue"></b><span data-b="addr"></span></p>
    <a class="b" id="mapgo" target="_blank" rel="noopener" data-b="mapBtn"></a>
  </div>
  <button class="b p" id="prt" data-b="printBtn"></button>
  <p class="wnote" id="pmsg"></p>
  <div class="panel wish" style="margin-top:22px">
    <h2 data-b="wishTitle"></h2>
    <p data-b="wishSub"></p>
    <input id="wn" maxlength="40" data-bp="wishNamePh" autocomplete="name">
    <textarea id="wt" maxlength="400" rows="3" data-bp="wishTextPh"></textarea>
    <button class="b p" id="wsend" data-b="wishSend"></button>
    <p id="msg" role="status"></p>
    <div id="wl"></div>
    <p class="wnote" id="wnote"></p>
  </div>
</section>

<div class="am" id="am" hidden role="dialog" aria-label="Album ảnh"><button id="ax" aria-label="Đóng">×</button><h3 data-b="albumTitle"></h3><div class="ag2" id="ag2"></div></div>
<div class="lb" id="lb" hidden role="dialog" aria-label="Xem ảnh">
  <button id="lx" aria-label="Đóng">×</button><button id="lpv" aria-label="Ảnh trước">‹</button>
  <img id="li" alt=""><button id="lnx" aria-label="Ảnh sau">›</button><p id="lc"></p>
</div>

<script src="config.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},stage=$("stage"),env=$("env"),card=$("card"),body=document.body,
      reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,
      cv=$("fx"),cx=cv.getContext("2d"),cv0=$("fx0"),pc=cv0.getContext("2d"),P=[],PT=[],opened=false,flip=0,flipCur=0,tx=0,ty=0,cx0=0,cy0=0,inside=false,lastT=0;

  /* ---- ornaments ---- */
  function pet(n,d,rx,ry,off,f){var s="";for(var i=0;i<n;i++)s+='<ellipse cx="0" cy="-'+d+'" rx="'+rx+'" ry="'+ry+'" fill="'+f+'" stroke="#fff8" stroke-width=".8" transform="rotate('+(off+i*360/n)+')"/>';return s}
  $("df").innerHTML='<g id="fl">'+pet(8,20,12,22,0,"#d9a93c")+pet(6,12,10,17,20,"#ecc872")+pet(5,6,7,11,10,"#fbe7ae")+'<circle r="4" fill="#800020"/></g><path id="lf" d="M0 0C10-14 30-14 42 0C30 14 10 14 0 0Z" fill="#a9cbab" stroke="#7fa782" stroke-width=".8"/>';
  var G='<use href="#lf" transform="translate(58,98) rotate(70)"/><use href="#lf" transform="translate(98,52) rotate(-12) scale(.9)"/><use href="#lf" transform="translate(14,74) rotate(100) scale(.8)"/><use href="#lf" transform="translate(70,12) rotate(8) scale(.7)"/>'+
    '<use href="#fl" transform="translate(42,42) scale(.95)"/><use href="#fl" transform="translate(108,24) scale(.5)"/><use href="#fl" transform="translate(26,108) scale(.55)"/><circle cx="84" cy="84" r="3.5" fill="#e8c76a"/><circle cx="96" cy="74" r="2.5" fill="#fbe7ae"/>';
  document.querySelectorAll("[data-g]").forEach(function(s){s.innerHTML=G});

  /* ---- data ---- */
  var DEF=window.CONFIG||{};
  var D=load();
  function load(){var d=JSON.parse(JSON.stringify(DEF));d.album=(Array.isArray(d.album)?d.album:[]).filter(function(x){return typeof x==="string"&&x});return d}
  var WD=D.weekdayNames;
  function render(){
    var p=(D.date||"2026-12-19").split("-"),dt=new Date(+p[0],p[1]-1,+p[2]),t=(D.time||"11:00").split(":"),V={};
    for(var k in D)V[k]=D[k];
    V.dmy=("0"+p[2]).slice(-2)+"."+p[1]+"."+p[0];V.wd=WD[dt.getDay()]||"";V.tm=(+t[0])+" "+D.hourWord+" "+(t[1]||"00");
    document.querySelectorAll("[data-b]").forEach(function(e){e.textContent=V[e.dataset.b]||""});
    document.querySelectorAll("[data-bp]").forEach(function(e){e.placeholder=V[e.dataset.bp]||""});
    var L=Math.max((D.bride||"").length,(D.groom||"").length);card.style.setProperty("--nz",L>16?.62:L>12?.76:L>9?.9:1);
    document.title="Thiệp mời cưới – "+D.bride+" & "+D.groom;
    drawAlb();card.classList.toggle("hasph",!!D.photo);if(D.photo)$("phimg").setAttribute("src",D.photo);else $("phimg").removeAttribute("src");
    target=new Date(D.date+"T"+(D.time||"00:00")+":00+07:00").getTime();
    $("mt").textContent=D.monthWord+" "+(+p[1])+", "+p[0];
    var first=(new Date(+p[0],p[1]-1,1).getDay()+6)%7,days=new Date(+p[0],+p[1],0).getDate(),h="";
    D.calHead.forEach(function(x){h+="<b>"+x+"</b>"});
    for(var i=0;i<first;i++)h+="<span></span>";
    for(var d=1;d<=days;d++)h+='<span'+(d===+p[2]?' class="on"':"")+">"+d+"</span>";
    $("grid").innerHTML=h;
    var mu=(D.mapurl||"").trim();$("mapgo").href=/^https?:\/\//i.test(mu)?mu:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((D.venue||"")+" "+(D.addr||""));
  }
  var LI=0;
  var AI=0,px=0,mv=false;
  function mk(u,i,fn){var b=document.createElement("button");b.className="ti";b.setAttribute("aria-label","Ảnh "+(i+1));var im=document.createElement("img");im.src=u;im.alt="Ảnh cưới "+(i+1);im.loading="lazy";im.draggable=false;b.appendChild(im);b.onclick=fn;return b}
  function openAm(){$("am").hidden=false;burst(innerWidth/2,innerHeight*.3,reduce?4:24,3)}
  function cfPos(){var n=(D.album||[]).length,box=$("ag"),bw=Math.min(innerWidth,520)-32,cw=Math.min(bw*.56,250);
    box.style.setProperty("--cw",cw+"px");box.style.height=(cw*1.5+40)+"px";
    [].forEach.call(box.children,function(el,i){var d=i-AI;if(d>n/2)d-=n;if(d<-n/2)d+=n;var ad=Math.abs(d),sg=d<0?-1:1,s=ad===0?1:ad===1?.78:.6;
      el.style.transform="translateX(-50%) translateX("+(ad===1?sg*cw*.68:ad===2?sg*cw*.98:ad>2?sg*cw*1.2:0)+"px) rotateY("+(ad?-sg*36:0)+"deg) scale("+s+")";
      el.style.zIndex=10-Math.min(ad,9);el.style.opacity=ad>2?0:ad===0?1:ad===1?.9:.55;el.style.pointerEvents=ad>2?"none":"auto"});
    $("cnt").textContent=n?(AI+1)+" / "+n:""}
  function go(i){var n=(D.album||[]).length;if(!n)return;AI=(i+n)%n;cfPos()}
  function drawAlb(){var a=D.album||[],box=$("ag"),b2=$("ag2");box.textContent="";b2.textContent="";$("alb").hidden=!a.length;AI=Math.min(AI,Math.max(a.length-1,0));
    a.forEach(function(u,i){box.appendChild(mk(u,i,function(){if(mv)return;i===AI?openAm():go(i)}));b2.appendChild(mk(u,i,function(){openLb(i)}))});cfPos()}
  $("allbtn").onclick=openAm;$("ax").onclick=function(){$("am").hidden=true};
  $("ag").addEventListener("pointerdown",function(e){px=e.clientX;mv=false});
  $("ag").addEventListener("pointerup",function(e){var dx=e.clientX-px;if(Math.abs(dx)>40){mv=true;go(AI+(dx<0?1:-1))}});
  addEventListener("resize",cfPos);
  setInterval(function(){if((D.album||[]).length<2||!$("am").hidden||!$("lb").hidden||reduce||document.hidden)return;go(AI+1)},3500);
  addEventListener("keydown",function(e){if(e.key==="Escape"&&$("lb").hidden)$("am").hidden=true});
  function openLb(i){var a=D.album||[];if(!a.length)return;LI=(i+a.length)%a.length;$("li").src=a[LI];$("lc").textContent=(LI+1)+" / "+a.length;$("lb").hidden=false}
  $("lx").onclick=function(){$("lb").hidden=true};
  $("lpv").onclick=function(e){e.stopPropagation();openLb(LI-1)};$("lnx").onclick=function(e){e.stopPropagation();openLb(LI+1)};
  $("lb").onclick=function(e){if(e.target===$("lb"))$("lb").hidden=true};
  addEventListener("keydown",function(e){if($("lb").hidden)return;if(e.key==="Escape")$("lb").hidden=true;if(e.key==="ArrowLeft")openLb(LI-1);if(e.key==="ArrowRight")openLb(LI+1)});
  var tsx=0;$("lb").addEventListener("touchstart",function(e){tsx=e.touches[0].clientX},{passive:true});
  $("lb").addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-tsx;if(Math.abs(dx)>50)openLb(LI+(dx<0?1:-1))});
  var target=0;render();

  /* ---- fx: petals + glitter ---- */
  function size(){cv.width=cv0.width=innerWidth*devicePixelRatio;cv.height=cv0.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);pc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
  size();addEventListener("resize",size);
  var PC=["#ff8a8a","#ff5a6a","#ffd9a0","#ffffff","#ffb3b3"];
  if(!reduce)for(var i=0;i<26;i++)PT.push(petal(Math.random()*innerHeight));
  function petal(y){return{x:Math.random()*innerWidth,y:y,s:5+Math.random()*7,vy:.4+Math.random()*.8,ph:Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.04,c:PC[i%5|0]}}
  function burst(x,y,n,s){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=Math.random()*s;P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,r:1+Math.random()*2.4,c:["#ffffff","#ffd27a","#ff8a8a"][i%3]})}}
  function draw(t){cx.clearRect(0,0,innerWidth,innerHeight);pc.clearRect(0,0,innerWidth,innerHeight);
    PT.forEach(function(p,i){p.y+=p.vy;p.x+=Math.sin(t/900+p.ph)*.6;p.r+=p.vr;if(p.y>innerHeight+20){p.y=-20;p.x=Math.random()*innerWidth}
      pc.save();pc.translate(p.x,p.y);pc.rotate(p.r);pc.globalAlpha=.7;pc.fillStyle=PC[i%5];pc.beginPath();pc.ellipse(0,0,p.s*1.4,p.s*.8,0,0,6.283);pc.fill();pc.restore()});
    for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.99;p.l-=.014;
      if(p.l<=0){P.splice(i,1);continue}cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}}
  function loop(t){
    if(!inside&&!reduce){tx=Math.cos(t/1800)*3;ty=Math.sin(t/1400)*6}
    cx0+=(tx-cx0)*.08;cy0+=(ty-cy0)*.08;flipCur+=(flip-flipCur)*.085;
    var mx=50+cy0*2.4,my=50-cx0*2.4;
    if(opened){var bob=reduce?0:Math.sin(t/800)*7;card.style.transform="translateY("+bob+"px) scale(1.02) rotateX("+cx0+"deg) rotateY("+(cy0+flipCur)+"deg)";$("gnd").style.setProperty("--gx",-cy0*2);$("gnd").style.setProperty("--gs",(1-bob/70).toFixed(3));
      card.style.setProperty("--mx",flipCur>90?100-mx:mx);card.style.setProperty("--my",my)}
    else env.style.transform="rotateX("+(16+cx0*.7)+"deg) rotateY("+(-8+cy0*.7)+"deg)";
    draw(t);requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  addEventListener("pointermove",function(e){
    inside=true;ty=(e.clientX/innerWidth-.5)*38;tx=-(e.clientY/innerHeight-.5)*28;
    if(opened&&!reduce&&e.timeStamp-lastT>40){lastT=e.timeStamp;burst(e.clientX,e.clientY,1,.9)}});
  addEventListener("pointerup",function(e){if(e.pointerType!=="mouse")inside=false});
  document.addEventListener("pointerleave",function(){inside=false});

  $("seal").addEventListener("click",function(e){
    if(stage.classList.contains("opening"))return;
    var r=e.currentTarget.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,reduce?10:70,5);
    stage.classList.add("opening");
    setTimeout(function(){var r2=env.getBoundingClientRect();burst(innerWidth/2,r2.top+r2.height*.3,reduce?10:60,6)},900);
    setTimeout(function(){body.classList.add("open");stage.classList.add("open");opened=true;burst(innerWidth/2,innerHeight/2,reduce?10:90,7)},1900)});
  function doFlip(){if(!opened)return;flip=flip?0:180;burst(innerWidth/2,innerHeight/2,reduce?6:40,4)}
  card.addEventListener("click",doFlip);
  card.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();doFlip()}});

  var box=$("cd");
  function tick(){var d=Math.max(0,target-Date.now()),v=[Math.floor(d/864e5),Math.floor(d%864e5/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)],l=[D.uDay,D.uHour,D.uMin,D.uSec];
    box.innerHTML=v.map(function(n,i){return "<div><span>"+(isNaN(n)?0:n)+"</span><i>"+l[i]+"</i></div>"}).join("")}
  tick();setInterval(tick,1000);
  function fmt(ts){try{var d=new Date(ts);return d.toLocaleDateString("vi-VN")+" "+d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
  var DB=null,WL=[],LOC=[];
  try{LOC=JSON.parse(localStorage.getItem("wishes"))||[]}catch(e){LOC=[]}
  function note(){$("wnote").textContent=DB?"Lời chúc được lưu chung, mọi người xem thiệp đều đọc được.":"Lời chúc đang được lưu trên thiết bị này."}
  function drawW(){var box=$("wl"),list=WL.concat(LOC).sort(function(a,b){return b.ts-a.ts});box.textContent="";
    if(!list.length){box.textContent="Chưa có lời chúc nào. Hãy là người đầu tiên!";return}
    list.forEach(function(w){var d=document.createElement("div");d.className="w";
      var m=document.createElement("small");m.textContent=fmt(w.ts);
      var b=document.createElement("b");b.textContent=w.name||"Khách mời";
      var p=document.createElement("p");p.textContent=w.text;
      d.appendChild(m);d.appendChild(b);d.appendChild(p);box.appendChild(d)})}
  drawW();note();
  if(window.claude&&claude.use)claude.use("db").then(function(db){if(!db)return;DB=db;note();
    db.collection("wishes").orderBy("ts","desc").limit(200).onSnapshot(function(s){WL=s.docs.map(function(d){return d.data()});drawW()},function(){DB=null;WL=[];note();drawW()})}).catch(function(){});
  $("prt").onclick=function(){
    var go=function(){try{window.print()}catch(e){}};
    if(!(window.claude&&claude.use)){go();return}
    claude.use("downloads").then(function(dl){
      if(!dl){go();return}
      var defs=[].map.call(document.querySelectorAll("body>svg"),function(e){return e.outerHTML}).join("");
      var doc='<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiệp mời cưới</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet"><style>'+document.querySelector("style").textContent+'</style></head><body class="open">'+defs+'<main class="stage open">'+card.outerHTML+'</main><script>onload=function(){setTimeout(function(){print()},800)}<\/script></body></html>';
      return dl.save({filename:"thiep-cuoi-in.html",data:doc}).then(function(){$("pmsg").textContent="Đã tải file. Mở file đó bằng trình duyệt rồi chọn in hoặc lưu PDF."},function(){})
    }).catch(go)};
  $("wsend").onclick=function(){var t=$("wt").value.trim();
    if(!t){$("msg").textContent="Hãy viết vài lời chúc nhé.";return}
    var w={name:$("wn").value.trim().slice(0,40),text:t.slice(0,400),ts:Date.now()};
    function ok(m){$("wt").value="";$("msg").textContent=m;burst(innerWidth/2,innerHeight*.75,50,4)}
    function local(m){LOC.push(w);try{localStorage.setItem("wishes",JSON.stringify(LOC))}catch(e){}drawW();ok(m)}
    if(DB)DB.collection("wishes").add(w).then(function(){ok("Cảm ơn bạn! Lời chúc đã được gửi.")},function(){local("Cảm ơn bạn! Bạn chưa có quyền gửi chung nên lời chúc được lưu trên thiết bị này.")});
    else local("Cảm ơn bạn! Lời chúc đã được lưu trên thiết bị này.")};
})();
</script>
</body>
</html>
